[project]
name = "adaptive-agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mmnsrti", email = "mmnsrti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.1",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
adaptive-agentic-rag = "adaptive_agentic_rag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
